name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Update version in manifest.json
        run: |
          python3 -c '
          import json
          path = "custom_components/ficollar/manifest.json"
          with open(path, "r") as f:
              data = json.load(f)
          data["version"] = "${{ env.VERSION }}"
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          '

      - name: Build zip archive
        run: |
          cd custom_components/ficollar
          zip -r ../../ficollar.zip . -x "*__pycache__*" -x "*.DS_Store*"
          cd ../..

      - name: Commit manifest version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): bump manifest version to ${{ env.VERSION }} [skip ci]"
          file_pattern: "custom_components/ficollar/manifest.json"
          branch: main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ficollar.zip
          generate_release_notes: true
